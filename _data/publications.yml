# ==========================================================================
#  PUBLICATIONS  —  content for the /publications/ page
#
#  Every entry below is rendered as a card. To add / edit / reorder papers,
#  just change this file — no HTML needed.
#
#  sections:   the headed groups on the page, shown in this order.
#    id        short key, referenced by each entry's `section:` field
#    heading   the visible section title
#
#  entries:    one card each, shown in the order listed here. Fields:
#    section   (required)  which section id the card belongs to
#    title     (required)  paper title  (Markdown / <em> allowed)
#    authors   (required)  full author list, comma separated.
#                          Convention: spell out every author. If a paper
#                          has more than 30 authors, keep the first five and
#                          last five and replace the middle with " … ";
#                          if Hoyin is one of the hidden middle authors,
#                          surface his name as " …, **Hoyin Chu**, … ".
#                          Wrap Hoyin's name in **double asterisks**; use
#                          <sup>#</sup> for equal-contribution marks.
#    venue     (required)  journal or preprint server
#    year      (required)  publication year
#    doi       (required)  DOI without the "https://doi.org/" prefix;
#                          the card title and the DOI button link here
#    image     (optional)  thumbnail under /images/pub_thumbs/  (a paper
#                          figure / graphical abstract). Omit for no image.
#    links     (optional)  extra buttons — a list of { text: , url: }
#    note      (optional)  short pill shown in the meta line
#    featured  (optional)  true  -> card gets a highlighted border
# ==========================================================================

footnote: '<sup>#</sup> Denotes equal contributions'

